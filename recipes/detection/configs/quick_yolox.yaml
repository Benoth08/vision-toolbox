# Verification rapide de la chaine YOLOX-tiny (CPU) : memes 240 images que quick_yolo, 2 epoques.
# --- Etapes 2 et 3 : importer et cataloguer ---
data:
  root: data/raw/neu_det/IMAGES
  layout: annotations
  annotations_dir: data/raw/neu_det/ANNOTATIONS
  annotation_format: voc
  color: gray
  max_images: 240
# --- Etape 4 : decouper ---
split: {file: outputs/detection/quick_split.csv, strategy: stratified, val_fraction: 0.15, test_fraction: 0.15}
# --- Etapes 6 a 10 : choix du moteur de detection ---
backend: yolox
# --- Etapes 6 a 10 : augmentation, lots, modele, perte et optimiseur, entrainement (moteur yolox) ---
yolox:
  variant: tiny
  weights: weights/yolox_tiny.pth        # poids COCO officiels, telecharges depuis GitHub s'ils manquent
  input_size: 320
  epochs: 2
  batch_size: 8
  warmup_epochs: 1
  patience: 2
# --- Etape 12 : exporter ---
export: {openvino: true, latency_runs: 5}
# --- Reglages generaux (etape 1) ---
runtime: {output_dir: outputs/detection/quick_yolox, num_workers: 0}
