# Transfert, strategie partial (le cas courant) : tete neuve + dernier bloc degele, taux 10 fois plus faible pour le backbone.
# --- Etapes 2 et 3 : importer et cataloguer ---
data:
  root: data/raw/neu_cls_flat       # tools/get_data/get_neu_cls.py : un dossier par classe
  layout: class_folders
  color: rgb                         # gray : 1 canal ; rgb : le gris recopie sur 3 canaux (poids ImageNet)
# --- Etape 4 : decouper ---
split:
  file: outputs/classification/split.csv   # le meme decoupage pour toutes les experiences : elles restent comparables
  strategy: stratified
  val_fraction: 0.15
  test_fraction: 0.15
# --- Etape 5 : pretraiter ---
preprocess:
  - {name: resize, size: 128}         # NEU-CLS fait 200 px ; 128 garde les defauts visibles et va 2,5 fois plus vite que 200
# --- Etape 6 : augmenter ---
augment:
  - {name: hflip}
  - {name: vflip}
# --- Etape 8 : modele ---
model:
  name: resnet18                    # catalogue : python recipes/classification/scripts/list_models.py
  pretrained: true
  transfer:
    strategy: partial
    unfreeze_last: 1                # layer4
    backbone_lr_factor: 0.1
# --- Etapes 7, 9 et 10 : lots, perte et optimiseur, entrainement ---
train: {epochs: 10, batch_size: 32, lr: 0.001, weight_decay: 0.0001, patience: 4, scheduler: plateau}
# --- Etape 12 : exporter ---
export: {openvino: true}
# --- Reglages generaux (etape 1) ---
runtime: {output_dir: outputs/classification/resnet18_partial, seed: 42, num_workers: 2}
