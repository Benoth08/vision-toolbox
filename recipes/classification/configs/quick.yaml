# Verification rapide de toute la chaine (moins de 2 minutes sur CPU) : a lancer apres toute modification.
# --- Etapes 2 et 3 : importer et cataloguer ---
data:
  root: data/raw/neu_cls_flat       # tools/get_data/get_neu_cls.py : un dossier par classe
  layout: class_folders
  color: rgb                         # gray : 1 canal ; rgb : le gris recopie sur 3 canaux (poids ImageNet)
# --- Etape 4 : decouper ---
split:
  file: outputs/classification/split.csv   # le meme decoupage pour toutes les experiences : elles restent comparables
  strategy: stratified
  val_fraction: 0.15
  test_fraction: 0.15
# --- Etape 5 : pretraiter ---
preprocess:
  - {name: resize, size: 64}          # petite taille : la verification doit etre rapide, pas precise
# --- Etape 6 : augmenter ---
augment:
  - {name: hflip}
  - {name: vflip}
# --- Etape 8 : modele ---
model:
  name: resnet18
  pretrained: true
  transfer: {strategy: head}
# --- Etapes 7, 9 et 10 : lots, perte et optimiseur, entrainement ---
train: {epochs: 2, batch_size: 32, lr: 0.001, patience: 2}
# --- Reglages generaux (etape 1) ---
runtime: {output_dir: outputs/classification/quick, seed: 42, num_workers: 0}
